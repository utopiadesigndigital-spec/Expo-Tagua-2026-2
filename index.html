<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=192, height=384, initial-scale=1.0">

<title>Expo Taguaí 2026</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 192px;
    height: 384px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
}

#tela {
    position: relative;

    width: 192px;
    height: 384px;

    overflow: hidden;
}

#fundo {
    position: absolute;

    left: 0;
    top: 0;

    width: 192px;
    height: 384px;

    display: block;

    object-fit: fill;
}

</style>

</head>

<body>

<div id="tela">

    <img
        id="fundo"
        src="fundo_expo.png"
        alt="Expo Taguaí 2026"
    >

</div>

</body>

</html>
