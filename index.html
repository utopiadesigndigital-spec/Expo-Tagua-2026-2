<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=192, height=384, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Expo Taguaí 2026</title>

<style>

/* =========================================
   CONFIGURAÇÃO GERAL
   ========================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 192px;
    height: 384px;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: #000;
}


/* =========================================
   TELA PRINCIPAL
   ========================================= */

#tela {

    position: relative;

    width: 192px;
    height: 384px;

    overflow: hidden;

    background: #000;
}


/* =========================================
   IMAGEM DE FUNDO
   ========================================= */

#fundo {

    position: absolute;

    left: 0;
    top: 0;

    width: 192px;
    height: 384px;

    display: block;

    object-fit: fill;

    z-index: 1;
}


/* =========================================
   CONTADOR
   ========================================= */

#contador {
    position: absolute;

    left: 0;
    top: 145px;

    width: 192px;
    height: 100px;

    text-align: center;

    z-index: 10;

    font-family: Arial, Helvetica, sans-serif;

    color: #ffffff;
}

/* =========================================
   "FALTAM"
   ========================================= */

#titulo {

    width: 192px;

    margin: 0 0 8px 0;

    text-align: center;

    font-size: 10px;

    font-weight: 700;

    letter-spacing: 3px;

    line-height: 12px;

    color: #ffffff;

    text-shadow:
        0 2px 4px rgba(0,0,0,0.9),
        0 0 8px rgba(0,0,0,0.9);
}


/* =========================================
   GRADE DOS NÚMEROS
   ========================================= */

#numeros {
    width: 140px;

    margin: 0 auto;

    display: grid;

    grid-template-columns: 65px 65px;

    column-gap: 4px;

    row-gap: 2px;

    justify-content: center;
}


/* =========================================
   CADA BLOCO
   ========================================= */

.bloco {
    width: 65px;

    text-align: center;
}

/* =========================================
   NÚMEROS
   ========================================= */

.numero {

    width: 69px;

    font-size: 25px;

    font-weight: 900;

    line-height: 27px;

    text-align: center;

    color: #ffffff;

    text-shadow:
        0 2px 4px rgba(0,0,0,1),
        0 0 8px rgba(0,0,0,1);
}


/* =========================================
   LABELS
   ========================================= */

.label {

    width: 69px;

    margin-top: 2px;

    text-align: center;

    font-size: 6px;

    font-weight: 700;

    letter-spacing: 1px;

    line-height: 8px;

    color: #ffffff;

    text-shadow:
        0 2px 3px rgba(0,0,0,1);
}


/* =========================================
   IMPORTANTE:
   ÁREA DOS PATROCINADORES
   FICA LIVRE.

   O contador termina aproximadamente
   antes dos 280px.

   O espaço de patrocinadores começa
   aproximadamente nos 301px.
   ========================================= */

</style>

</head>


<body>

<div id="tela">


    <!-- =====================================
         FUNDO DA EXPO
         ===================================== -->

    <img
        id="fundo"
        src="fundo_expo.png"
        alt="Expo Taguaí 2026"
    >


    <!-- =====================================
         CONTADOR
         ===================================== -->

    <div id="contador">

        <div id="titulo">
            FALTAM
        </div>


        <div id="numeros">


            <!-- DIAS -->

            <div class="bloco">

                <div
                    class="numero"
                    id="dias">
                    00
                </div>

                <div class="label">
                    DIAS
                </div>

            </div>


            <!-- HORAS -->

            <div class="bloco">

                <div
                    class="numero"
                    id="horas">
                    00
                </div>

                <div class="label">
                    HORAS
                </div>

            </div>


            <!-- MINUTOS -->

            <div class="bloco">

                <div
                    class="numero"
                    id="minutos">
                    00
                </div>

                <div class="label">
                    MINUTOS
                </div>

            </div>


            <!-- SEGUNDOS -->

            <div class="bloco">

                <div
                    class="numero"
                    id="segundos">
                    00
                </div>

                <div class="label">
                    SEGUNDOS
                </div>

            </div>


        </div>

    </div>


</div>


<!-- =========================================
     JAVASCRIPT DA CONTAGEM
     ========================================= -->

<script>

function atualizarContagem() {

    /*
       EVENTO:

       24 DE SETEMBRO DE 2026
       ÀS 21:00
       HORÁRIO DE BRASÍLIA
    */

    const evento =
        new Date("2026-09-24T21:00:00-03:00");


    const agora =
        new Date();


    let diferenca =
        evento.getTime() - agora.getTime();


    /*
       SE O EVENTO JÁ COMEÇOU
    */

    if (diferenca <= 0) {

        document.getElementById("dias").textContent = "00";

        document.getElementById("horas").textContent = "00";

        document.getElementById("minutos").textContent = "00";

        document.getElementById("segundos").textContent = "00";

        return;
    }


    /*
       DIAS
    */

    const dias =
        Math.floor(
            diferenca /
            (1000 * 60 * 60 * 24)
        );


    diferenca =
        diferenca %
        (1000 * 60 * 60 * 24);


    /*
       HORAS
    */

    const horas =
        Math.floor(
            diferenca /
            (1000 * 60 * 60)
        );


    diferenca =
        diferenca %
        (1000 * 60 * 60);


    /*
       MINUTOS
    */

    const minutos =
        Math.floor(
            diferenca /
            (1000 * 60)
        );


    diferenca =
        diferenca %
        (1000 * 60);


    /*
       SEGUNDOS
    */

    const segundos =
        Math.floor(
            diferenca /
            1000
        );


    /*
       ATUALIZA OS NÚMEROS
    */

    document.getElementById("dias").textContent =
        String(dias).padStart(2, "0");


    document.getElementById("horas").textContent =
        String(horas).padStart(2, "0");


    document.getElementById("minutos").textContent =
        String(minutos).padStart(2, "0");


    document.getElementById("segundos").textContent =
        String(segundos).padStart(2, "0");

}


/*
   PRIMEIRA ATUALIZAÇÃO
*/

atualizarContagem();


/*
   ATUALIZA A CADA 1 SEGUNDO
*/

setInterval(
    atualizarContagem,
    1000
);

</script>


</body>

</html>
